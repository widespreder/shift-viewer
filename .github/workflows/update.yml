name: Update shifts

on:
  schedule:
    # JST 8:00, 12:00, 17:00, 21:00 (UTC 23, 3, 8, 12)
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit if changed
        run: |
          git config user.name "shift-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git diff --quiet shifts.json; then
            git add shifts.json
            git commit -m "auto: update shifts $(date +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "No changes"
          fi
